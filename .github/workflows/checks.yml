name: macOS checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift test
      - run: ./Scripts/build-app.sh release --universal
      - run: ./Scripts/build-dmg.sh
      - name: Verify ad-hoc upgrade and relaunch with a disposable key
        run: python3 Scripts/tests/test-update.py
