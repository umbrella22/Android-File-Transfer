name: Release

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example, v0.1.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish macOS app
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          git log -1 --format='%H %D'

      - name: Run tests
        run: swift test

      - name: Build universal release app
        run: ./Scripts/build-app.sh release --universal

      - name: Verify app bundle
        run: |
          app='dist/Android File Transfer.app'
          plutil -lint "$app/Contents/Info.plist"
          for arch in arm64 x86_64; do
            lipo "$app/Contents/MacOS/AndroidFileTransferApp" -verify_arch "$arch"
          done
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Build and verify drag-to-install DMG
        run: ./Scripts/build-dmg.sh

      - name: Generate checksum
        working-directory: dist
        run: |
          shasum -a 256 Android-File-Transfer-macOS-universal.dmg > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          assets=(dist/Android-File-Transfer-macOS-universal.dmg dist/SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
